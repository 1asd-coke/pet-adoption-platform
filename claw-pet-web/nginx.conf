# ============================================================
# Claw Pet 前端 Nginx 配置
#
# 这份配置必须和开发环境的 vite.config.js 保持一致 ——
# 开发时是 Vite 的 dev server 在做代理，上线后这个角色由 Nginx 接手。
# 少转发一条路径，开发时正常、上线后就 404，这类问题最难查。
#
# vite.config.js 里的三条代理，这里一条都不能少：
#   /api     → 后端接口
#   /ws      → WebSocket（注意要带 Upgrade 头）
#   /profile → 上传的图片（宠物封面、头像）
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------- 日志 ----------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---------- 上传体积 ----------
    # 后端 application.yml 里 multipart 上限是 30MB。
    # Nginx 默认只有 1MB —— 不放开的话上传宠物图会返回 413，
    # 而且报错发生在 Nginx 层，后端日志里什么都看不到。
    client_max_body_size 30m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/vnd.ms-fontobject font/ttf font/otf
               image/svg+xml;

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    # ---------- WebSocket ----------
    # 必须显式带 Upgrade / Connection 头，否则握手失败（会退化成普通请求然后报错）
    location /ws {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 上传的图片（宠物封面 / 头像） ----------
    # 注意：前端有个个人中心页面，路由也是 /profile。
    # 但那个页面走的是 hash 路由（/#/profile），Nginx 根本看不到 /profile 这个请求，
    # 所以这里只处理带子路径的图片请求。
    # 下面这条 `location = /profile` 是为了对齐 vite.config.js 里的 bypass 行为：
    # 万一有人直接访问 /profile（没有子路径），返回首页而不是把请求转给后端。
    location = /profile {
        try_files /index.html =404;
    }

    location /profile/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 图片是静态资源，交给浏览器缓存；
        # 文件名是 UUID 或 demo-XX，内容不会变，所以可以长缓存
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 带指纹的静态资源，长缓存 ----------
    # Vite 产出的 assets/ 文件名里带 hash，内容变了文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 单页应用兜底 ----------
    # 本项目用的是 hash 路由，严格说不会走到这里；
    # 但保留 try_files 是为了以后万一换成 history 路由不会整站 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

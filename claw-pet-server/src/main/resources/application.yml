server:
  # 容器部署时可用 SERVER_PORT 覆盖（docker-compose 里就是靠这个对齐端口）
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    # 库地址 / 账号 / 密码都可用环境变量覆盖，方便换机器、换端口部署
    url: ${DB_URL:jdbc:mysql://localhost:3306/claw_pet?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  data:
    redis:
      # 容器部署时 Redis 是另一个服务（如 docker-compose 里的 redis），
      # 所以不能写死 localhost —— 用 REDIS_HOST / REDIS_PORT 覆盖
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  type-aliases-package: com.clawpet.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # 密钥只从环境变量 JWT_SECRET 来（≥32 字节）。
  # 不配置时**不会**退回到任何写死在代码里的默认值，而是由 JwtUtil 在启动时随机生成一个：
  # 既保住「clone 下来不配也能起」的便利，又让外人拿不到密钥、无法伪造登录态。
  # 代价：随机密钥重启即失效（需重新登录），本地开发无所谓。
  secret: ${JWT_SECRET:}
  expiration: 86400000

upload:
  # 相对路径的基准是「后端模块根目录」（IDE 运行取 claw-pet-server/，jar 运行取 jar 所在目录），
  # 与启动时的工作目录无关，避免出现"上传成功但图片打不开"。
  path: ./upload

cleanup:
  cron: "0 0 0 * * ?"
  orphan-grace-period-days: 1
  enabled: true
